<!DOCTYPE html>
<html>
    <head>
        <title>Atividade 13</title>
    </head>
    <body>
        <h1>Formulário de Cadastro</h1>
        <farm action="/enviar_dados" method="post">
            <label for="nome">Nome:</label>
            <input type="text" id="nome" name="nome" required><br><br>
            <label for="email">Email:</label>
            <input type="email" id="email" name="emai" required><br><br>
            <label for="pais">País:</label>
            <select id="pais" name="pais">
                <option value="brasil">Brasil</option>
                <option value="italia">Itália</option>
                <option value="Coreia do sul">Coreia do Sul</option>
            </select><br><br>
            <label for="mensagem">Mensagem</label>
            <textarea id="mensagem" name="mensagem" rows="4" cols="30"></textarea><br><br>
            <input type="submit" id="Enviar">
            <input type="reset" id="Limpar">
        </farm>
    </body>
</html>
